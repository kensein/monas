# Apache reverse proxy — NWP Verification Dashboard (webpsi)
# Install: sudo cp deploy/apache-nwp-verify.conf /etc/apache2/sites-available/nwp-verify.conf
#          sudo a2enmod proxy proxy_http headers rewrite
#          sudo a2ensite nwp-verify.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName webpsi.bmkg.go.id
    # ServerAlias nwp-verify.bmkg.go.id

    # Redirect HTTP → HTTPS (uncomment jika SSL sudah ada)
    # Redirect permanent / https://webpsi.bmkg.go.id/

    DocumentRoot /var/www/nwp-verify/frontend

    # Dashboard static + API proxy (pola psiidn)
    <Location /nwp-verify>
        ProxyPreserveHost On
        ProxyPass        /nwp-verify/api http://127.0.0.1:8013/api
        ProxyPassReverse /nwp-verify/api http://127.0.0.1:8013/api
        ProxyPass        /nwp-verify http://127.0.0.1:3013/
        ProxyPassReverse /nwp-verify http://127.0.0.1:3013/
    </Location>

    # Rewrite untuk asset frontend (jika diakses tanpa trailing slash)
    RewriteEngine On
    RewriteRule ^/nwp-verify$ /nwp-verify/ [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/nwp-verify-error.log
    CustomLog ${APACHE_LOG_DIR}/nwp-verify-access.log combined
</VirtualHost>

