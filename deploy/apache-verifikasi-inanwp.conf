# Apache snippet — tambahkan ke vhost portal PSIMKG
# SEBELUM catch-all ProxyPass / ke 127.0.0.1:3001
#
# Test: sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Publik: https://psimkg.bmkg.go.id/verifikasi-inanwp/

# API lebih spesifik dulu (harus di atas rule frontend)
ProxyPass        /verifikasi-inanwp/api http://127.0.0.1:8013/api
ProxyPassReverse /verifikasi-inanwp/api http://127.0.0.1:8013/api

# Frontend static (Node server-static.js di :3013)
ProxyPass        /verifikasi-inanwp     http://127.0.0.1:3013/verifikasi-inanwp
ProxyPassReverse /verifikasi-inanwp     http://127.0.0.1:3013/verifikasi-inanwp

# Redirect tanpa trailing slash (opsional)
# RewriteRule ^/verifikasi-inanwp$ /verifikasi-inanwp/ [R=301,L]
