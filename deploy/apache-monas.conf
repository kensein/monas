# Apache snippet — tambahkan ke vhost portal PSIMKG
# SEBELUM catch-all ProxyPass / ke 127.0.0.1:3001
#
# Test: sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Publik: https://psimkg.bmkg.go.id/monas/

# API lebih spesifik dulu (harus di atas rule frontend)
ProxyPass        /monas/api http://127.0.0.1:8013/api
ProxyPassReverse /monas/api http://127.0.0.1:8013/api

# Frontend static (server-static.js di :3013)
ProxyPass        /monas     http://127.0.0.1:3013/monas
ProxyPassReverse /monas     http://127.0.0.1:3013/monas

# Redirect tanpa trailing slash (opsional)
# RewriteRule ^/monas$ /monas/ [R=301,L]
